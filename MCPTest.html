<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MCP WebSocket Client</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        #log {
            white-space: pre-wrap;
            background: #f4f4f4;
            padding: 10px;
            border: 1px solid #ccc;
            height: 300px;
            overflow-y: auto;
        }
        .tool-container {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #ddd;
            background: #fafafa;
        }
        .param {
            margin-bottom: 10px;
        }
    </style>
</head>
    <body>

        <h2>MCP WebSocket Test Client</h2>

        <label>WebSocket URL:</label>
        <input id="wsUrl" value="ws://localhost:8765" size="40">
        <button onclick="connectWS()">Connect</button>

        <h3>Log</h3>
        <div id="log"></div>

        <h3>Tools</h3>
        <select id="toolSelect"></select>
        <button onclick="loadToolUI()">Load Params</button>

        <div id="toolUI" class="tool-container"></div>
        <button onclick="callTool()">Call Tool</button>

        <script>
            let ws = null;
            let tools = {};

            function log(msg) {
                const logDiv = document.getElementById("log");
                logDiv.textContent += msg + "\n";
                logDiv.scrollTop = logDiv.scrollHeight;
            }

            function connectWS() {
                const url = document.getElementById("wsUrl").value;
                ws = new WebSocket(url);

                ws.onopen = () => {
                    log("Connected to " + url);
                    sendJSON({
                        jsonrpc: "2.0",
                        id: 1,
                        method: "initialize",
                        params: {}
                    });
                };

                ws.onerror = (e) => log("WebSocket error");

                ws.onmessage = (msg) => {
                    log("<< " + msg.data);
                    const data = JSON.parse(msg.data);
                    handleResponse(data);
                };
            }

            function sendJSON(obj) {
                const json = JSON.stringify(obj);
                log(">> " + json);
                ws.send(json);
            }

            function handleResponse(res) {
                if (res.result && res.result.capabilities) {
                    log("Initialization complete. Loading tools...");
                    sendJSON({
                        jsonrpc: "2.0",
                        id: 2,
                        method: "tools/list",
                        params: {}
                    });
                }

                if (res.result && res.result.tools) {
                    tools = {};
                    const select = document.getElementById("toolSelect");
                    select.innerHTML = "";

                    res.result.tools.forEach(t => {
                        tools[t.name] = t;
                        select.innerHTML += `<option value="${t.name}">${t.name}</option>`;
                    });

                    log("Tools loaded.");
                }
            }

            function loadToolUI() {
                const toolName = document.getElementById("toolSelect").value;
                const tool = tools[toolName];
                if (!tool) return;

                const ui = document.getElementById("toolUI");
                ui.innerHTML = `<h4>${tool.name}</h4><p>${tool.description}</p>`;

                const props = tool.parameters?.properties || {};

                for (const key of Object.keys(props)) {
                    ui.innerHTML += `
                        <div class="param">
                            <label>${key} (${props[key].type}):</label><br>
                            <input id="param_${key}" size="30">
                        </div>`;
                }
            }

            function callTool() {
                const toolName = document.getElementById("toolSelect").value;
                const tool = tools[toolName];

                const props = tool.parameters?.properties || {};
                const args = {};

                for (const key of Object.keys(props)) {
                    const val = document.getElementById("param_" + key).value;
                    const type = props[key].type;

                    if (type === "integer") {
                        args[key] = parseInt(val, 10);
                    } else if (type === "number") {
                        args[key] = parseFloat(val);
                    } else if (type === "boolean") {
                        args[key] = (val.toLowerCase() === "true");
                    } else {
                        args[key] = val;
                    }
                }

                sendJSON({
                    jsonrpc: "2.0",
                    id: Date.now(),
                    method: "tools/call",
                    params: { name: toolName, arguments: args }
                });
            }
        </script>
    </body>
</html>
