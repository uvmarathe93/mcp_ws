<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>MCP WebSocket Test Client</title>
        <style>
            body { font-family: Arial; margin: 20px; }
            textarea { width: 100%; height: 120px; }
            pre { background: #f4f4f4; padding: 10px; height: 250px; overflow-y: scroll; }
            .btn { padding: 8px 16px; margin-right: 10px; cursor: pointer; }
        </style>
    </head>
    <body>

    <h2>MCP WebSocket Test Client</h2>

    <label>WebSocket URL:</label><br>
    <input id="wsUrl" value="ws://localhost:8765" style="width: 300px;">
    <button class="btn" onclick="connectWS()">Connect</button>

    <h3>Outgoing Request</h3>
    <textarea id="requestBox">
        {
        "jsonrpc": "2.0",
        "id": 1,
        "method": "initialize",
        "params": {}
        }
    </textarea>
    <br>
    <button class="btn" onclick="sendRequest()">Send</button>
    <button class="btn" onclick="sendToolsList()">tools/list</button>

    <h3>Incoming Messages</h3>
    <pre id="log"></pre>

    <script>
    let ws;

    function log(msg) {
        const logBox = document.getElementById("log");
        logBox.textContent += msg + "\n\n";
        logBox.scrollTop = logBox.scrollHeight;
    }

    function connectWS() {
        const url = document.getElementById("wsUrl").value;
        ws = new WebSocket(url);

        ws.onopen = () => log("✅ Connected to " + url);
        ws.onmessage = evt => log("⬅️ " + evt.data);
        ws.onerror = err => log("❌ Error: " + err.message);
        ws.onclose = () => log("🔌 Connection closed");
    }

    function sendRequest() {
        if (!ws || ws.readyState !== WebSocket.OPEN) 
            return alert("WebSocket is not connected.");

        const txt = document.getElementById("requestBox").value;
        try {
            JSON.parse(txt); // validate JSON
            ws.send(txt);
            log("➡️ " + txt);
        } catch (e) {
            alert("Invalid JSON: " + e);
        }
    }

    function sendToolsList() {
        const req = {
            jsonrpc: "2.0",
            id: Math.floor(Math.random() * 99999),
            method: "tools/list",
            params: {}
        };
        ws.send(JSON.stringify(req));
        log("➡️ " + JSON.stringify(req, null, 2));
    }
    </script>
    </body>
</html>
